<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mathe-Halloweenparty</title>
<style>:root{--bg:#17131f;--card:#fff7e8;--o:#f28c28;--p:#7a4b91;--ink:#292331}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#3b2850,#17131f 65%);color:#fff;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:5px 0;font-size:clamp(25px,4vw,44px)}.pill{background:var(--o);color:#241827;padding:9px 14px;border-radius:999px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button,.btn{border:0;border-radius:14px;padding:11px 14px;font-size:16px;font-weight:800;cursor:pointer}.tabs button{background:#efe4f4;color:#3b2850}.tabs button.on{background:var(--o)}.card{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;min-height:480px;box-shadow:0 12px 35px #0006}.center{text-align:center}.number{font-size:clamp(70px,14vw,150px);font-weight:900;color:var(--p);line-height:1}.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px auto;max-width:720px}.ops button{font-size:30px;padding:18px;border:3px solid var(--o);border-radius:18px;background:#fff;font-weight:900}.answer{font-size:42px;font-weight:900;min-height:52px;color:#4c8b36}.line{display:grid;grid-template-columns:repeat(11,1fr);margin:30px 0 10px;border-top:6px solid var(--p)}.tick{text-align:center;position:relative;padding-top:15px;font-weight:800}.tick:before{content:"";position:absolute;width:3px;height:15px;background:var(--p);top:-8px;left:50%}.bigbtn{background:var(--o);color:#251b2b;margin:6px}.ghost{font-size:70px}.challenge{font-size:clamp(30px,6vw,60px);font-weight:900;margin:30px 0}.score{font-size:22px;font-weight:800}.hidden{display:none}.small{font-size:18px}.footer{opacity:.8;text-align:center;margin-top:8px}@media(max-width:700px){.ops{grid-template-columns:repeat(2,1fr)}.card{min-height:420px;padding:12px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>🎃 Mathe-Halloweenparty</h1><div class="small">Klasse 2 · Zahlenraum bis 100</div></div><div class="pill">±10 · ±1</div></div>
<div class="tabs"><button onclick="show('zauber',this)" class="on">🎃 Zahlenzauber</button><button onclick="show('sprung',this)">👻 Rechenstrich</button><button onclick="show('duell',this)">🦇 Monster-Finale</button></div>
<section id="zauber" class="card center"><div class="ghost">🧙‍♀️</div><div id="start" class="number">47</div><div class="ops"><button onclick="calc(10)">+10</button><button onclick="calc(-10)">−10</button><button onclick="calc(1)">+1</button><button onclick="calc(-1)">−1</button></div><div id="ans" class="answer">?</div><button class="btn bigbtn" onclick="newStart()">Neue Zahl</button></section>
<section id="sprung" class="card center hidden"><div class="ghost">👻</div><div id="task" class="challenge"></div><div class="line" id="line"></div><button class="btn bigbtn" onclick="reveal()">Ziel zeigen</button><button class="btn bigbtn" onclick="newTask()">Neuer Sprung</button><div id="target" class="answer">?</div></section>
<section id="duell" class="card center hidden"><div class="ghost">🦇 🎃 👻</div><div class="small">Rechne im Kopf und tippe auf die richtige Zahl.</div><div id="q" class="challenge"></div><div id="choices" class="ops"></div><div id="feedback" class="answer"></div><div class="score">Punkte: <span id="score">0</span></div><button class="btn bigbtn" onclick="quiz()">Neue Aufgabe</button></section><div class="footer">Großer Sprung = 10 · kleiner Schritt = 1</div></div>
<script>let current=47,targetVal=53,score=0,quizAnswer=0;function show(id,b){document.querySelectorAll('section.card').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function newStart(){current=Math.floor(Math.random()*79)+11;document.getElementById('start').textContent=current;document.getElementById('ans').textContent='?'}function calc(d){let n=current+d;if(n<0||n>100)return;document.getElementById('ans').textContent=current+(d>0?' + ':' − ')+Math.abs(d)+' = '+n}let line=document.getElementById('line');for(let i=0;i<=100;i+=10){let d=document.createElement('div');d.className='tick';d.textContent=i;line.appendChild(d)}function newTask(){let ops=[10,-10,1,-1],d=ops[Math.floor(Math.random()*4)],s;do{s=Math.floor(Math.random()*91)+5}while(s+d<0||s+d>100);targetVal=s+d;document.getElementById('task').textContent=s+(d>0?' + ':' − ')+Math.abs(d)+' = ?';document.getElementById('target').textContent='?'}function reveal(){document.getElementById('target').textContent=targetVal}function quiz(){let ops=[10,-10,1,-1],d=ops[Math.floor(Math.random()*4)],s;do{s=Math.floor(Math.random()*91)+5}while(s+d<0||s+d>100);quizAnswer=s+d;document.getElementById('q').textContent=s+(d>0?' + ':' − ')+Math.abs(d)+' = ?';let vals=[quizAnswer];while(vals.length<4){let v=Math.max(0,Math.min(100,quizAnswer+[-10,-1,1,10][Math.floor(Math.random()*4)]));if(!vals.includes(v))vals.push(v)}vals.sort(()=>Math.random()-.5);let c=document.getElementById('choices');c.innerHTML='';vals.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>pick(v);c.appendChild(b)});document.getElementById('feedback').textContent=''}function pick(v){if(v===quizAnswer){score++;document.getElementById('feedback').textContent='🎃 Richtig!';document.getElementById('score').textContent=score}else document.getElementById('feedback').textContent='👻 Noch einmal!'}newTask();quiz();</script></body></html>
